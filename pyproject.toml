[project]
name = "trycore-evm-challenge"
version = "0.1.0"
description = ""
authors = [
    {name = "JeissonRuiz02",email = "jeissonruizdev@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.142.2,<0.143.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "sqlalchemy (>=2.1.3,<3.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "black (>=26.10.0,<27.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.coverage.run]
source = ["app"]
omit = ["*/alembic/*"]

[tool.coverage.report]
fail_under = 80
